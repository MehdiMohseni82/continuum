# Continuum — SERVER deployment (backend only; the daemon runs on your local machines).
# Run from infra/:  docker compose -f docker-compose.server.yml up -d --build
# db and ollama are NOT published to the host; only the app is, on 127.0.0.1:5050 (nginx fronts it).
name: continuum

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    volumes:
      - continuum-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum -d continuum"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - continuum-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["sh", "-c", "ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} && ollama pull ${GENERATION_MODEL:-qwen2.5:7b-instruct}"]
    restart: "no"

  host:
    build:
      context: ..
      dockerfile: src/Continuum.Host/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=continuum;Username=continuum;Password=${POSTGRES_PASSWORD:?set in infra/.env}"
      Continuum__Token: "${CONTINUUM_TOKEN:?set in infra/.env}"
      Embeddings__Provider: "ollama"
      Embeddings__Endpoint: "http://ollama:11434"
      Embeddings__Model: "${EMBEDDING_MODEL:-nomic-embed-text}"
      Generation__Endpoint: "http://ollama:11434"
      Generation__Model: "${GENERATION_MODEL:-qwen2.5:7b-instruct}"
      Backups__Directory: "/backups"
      # Auth (Phase 7). Legacy token stays valid until you set Auth__AllowLegacyToken=false.
      Auth__AllowLegacyToken: "${AUTH_ALLOW_LEGACY:-true}"
      Auth__AdminEmail: "${AUTH_ADMIN_EMAIL:-}"
      Auth__AdminPassword: "${AUTH_ADMIN_PASSWORD:-}"
      Auth__AdminName: "${AUTH_ADMIN_NAME:-Admin}"
      Auth__AuthSecret: "${AUTH_SECRET:-}"
      Auth__SecureCookie: "${AUTH_SECURE_COOKIE:-true}"
      # Claude API key. Optional: with it unset the host runs exactly as before — generation stays on
      # self-hosted Ollama and nothing leaves the network. Setting it registers AnthropicChatCompleter,
      # which room drafting prefers over the 7B local model and which the server-side room agent has
      # always required (it has never run here, because this variable was never passed through).
      #
      # This does NOT start the autonomous room loop. That stays behind ServerAgents__Enabled, which is
      # false by default and deliberately so: an unattended loop is what ran two agents for 48 hours.
      ServerAgents__ApiKey: "${ANTHROPIC_API_KEY:-}"
      ServerAgents__Model: "${SERVER_AGENT_MODEL:-claude-opus-5}"
      ServerAgents__Enabled: "${SERVER_AGENTS_ENABLED:-false}"
      ASPNETCORE_HTTP_PORTS: "5000"
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - continuum-backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # Scheduled DB backups: gzip pg_dump to a named volume, with retention.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?set in infra/.env}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
    volumes:
      - continuum-backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Next.js UI. Talks to the API over the internal network; nginx routes /api -> host, / -> web.
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTINUUM_BACKEND: "http://host:5000"
      CONTINUUM_TOKEN: "${CONTINUUM_TOKEN:?set in infra/.env}"
    ports:
      - "127.0.0.1:5060:3000"
    depends_on:
      - host

volumes:
  continuum-db:
  continuum-ollama:
  continuum-backups:
