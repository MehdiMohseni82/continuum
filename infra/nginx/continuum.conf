# Continuum (DotNet Talk).
#   /api/*  -> backend API on :5050 (bearer token; used by the daemon + MCP) — no basic auth.
#   /*      -> Next.js UI on :5060 (browser; includes its own /bff/* proxy routes) — basic auth.
upstream continuum_api { server 127.0.0.1:5050; keepalive 32; }
upstream continuum_web { server 127.0.0.1:5060; keepalive 32; }

server {
    server_name continuum.dotnet-talk.com;
    client_max_body_size 50m;   # room for gzipped event batches

    # Backend API — authenticated in the app via Authorization: Bearer <CONTINUUM_TOKEN>.
    location /api/ {
        proxy_pass http://continuum_api;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Next.js UI (and its server-side /bff/* proxy) — gated with Basic Auth.
    location / {
        auth_basic "Continuum";
        auth_basic_user_file /etc/nginx/continuum.htpasswd;
        proxy_pass http://continuum_web;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/continuum.dotnet-talk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/continuum.dotnet-talk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = continuum.dotnet-talk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name continuum.dotnet-talk.com;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
